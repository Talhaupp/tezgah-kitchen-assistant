<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tezgah</title><style>*{box-sizing:border-box}body{margin:0;background:#f3efe6;color:#1b332a;font:18px system-ui;padding:22px;max-width:760px;margin:auto}header{display:flex;align-items:center;gap:12px}header b{font-size:36px}header span{color:#638073}video{display:block;width:100%;height:36vh;min-height:210px;background:#132820;border-radius:24px;object-fit:cover;margin:18px 0}input,button{font:inherit;border-radius:14px;padding:14px;border:1px solid #c5d0c8;margin:5px 0;width:100%}button{background:#185541;color:white;border:0;font-weight:700}button.secondary{background:#dfe9e2;color:#1b332a}small{display:block;color:#65756d;margin:12px 4px}article{white-space:pre-wrap;background:white;border-radius:18px;padding:20px;min-height:100px;line-height:1.5}details{margin:10px 0}</style><header><b>🥣 Tezgah</b><span>Canlı mutfak asistanı</span></header><video id="camera" muted playsinline autoplay></video><input id="dish" placeholder="Bugün ne pişiriyoruz? Örn. menemen"><details><summary>Bağlantı ayarları</summary><input id="endpoint" placeholder="HTTPS asistan sunucu adresi"><input id="token" type="password" placeholder="Sunucu erişim anahtarı"></details><small>Oturum sırasında kısa kamera görüntüleri ve ses kayıtları, yanıt üretmek için yapılandırdığın sunucuya gönderilir.</small><button id="start">Canlı pişirmeyi başlat</button><button class="secondary" onclick="stopSession()">Durdur</button><article id="out">Tarifini yaz ve canlı pişirmeyi başlat.</article><p id="sources"></p><script>let stream,session=0,controller,history=[];function stopSession(){session++;controller?.abort();stream?.getTracks().forEach(t=>t.stop());speechSynthesis.cancel();document.querySelector('#start').disabled=false}const b64=blob=>new Promise(resolve=>{let r=new FileReader;r.onload=()=>resolve(r.result.split(',')[1]);r.readAsDataURL(blob)});document.querySelector('#start').onclick=async()=>{stopSession();let id=session,button=document.querySelector('#start'),out=document.querySelector('#out');button.disabled=true;history=[];try{let url=new URL(document.querySelector('#endpoint').value),token=document.querySelector('#token').value,dish=document.querySelector('#dish').value.trim();if(url.protocol!=='https:'||!token||!dish)throw Error('Tarif, HTTPS sunucu adresi ve erişim anahtarı gerekli.');stream=await navigator.mediaDevices.getUserMedia({audio:true,video:{facingMode:{ideal:'environment'},width:{ideal:640}}});document.querySelector('#camera').srcObject=stream;controller=new AbortController();while(id===session){let audio=new MediaStream(stream.getAudioTracks()),blob=await new Promise(resolve=>{let chunks=[],r=new MediaRecorder(audio);r.ondataavailable=e=>chunks.push(e.data);r.onstop=()=>resolve(new Blob(chunks,{type:r.mimeType}));r.start();setTimeout(()=>r.state==='recording'&&r.stop(),3500)});if(id!==session)break;let v=document.querySelector('#camera'),c=document.createElement('canvas');c.width=480;c.height=Math.round(480*v.videoHeight/v.videoWidth);c.getContext('2d').drawImage(v,0,0,c.width,c.height);let res=await fetch(url,{method:'POST',signal:controller.signal,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({dish,history,image:c.toDataURL('image/jpeg',.65).split(',')[1],audio:await b64(blob),mime:blob.type.split(';')[0]})});if(!res.ok)throw Error('Asistan sunucusu yanıtı: '+res.status);let data=await res.json();if(data.text&&data.text!=='BEKLE'){out.textContent=data.text;history.push(data.text);history=history.slice(-8);let u=new SpeechSynthesisUtterance(data.text);u.lang='tr-TR';speechSynthesis.speak(u)}document.querySelector('#sources').textContent=(data.sources||[]).join(' • ')}}catch(e){if(id===session){stopSession();out.textContent=e.message}}};</script></html>
